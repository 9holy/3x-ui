{{define "form/rawProtocol"}}
<a-alert type="info" show-icon message="Protocol JSON" description="This protocol uses the native runtime configuration. Keep the original panel and edit the protocol fields as JSON." style="margin-bottom: 12px;"></a-alert>
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <a-form-item label="Settings JSON">
        <a-textarea v-model="inbound.rawSettingsText" :rows="10" spellcheck="false"></a-textarea>
    </a-form-item>
    <a-form-item label="Stream JSON">
        <a-textarea v-model="inbound.rawStreamSettingsText" :rows="10" spellcheck="false"></a-textarea>
    </a-form-item>
</a-form>
{{end}}
