{{define "form/streamSettings"}}
<!-- select stream network -->
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <a-form-item label='{{ i18n "transmission" }}'>
        <a-select v-model="inbound.stream.network" style="width: 75%" @change="streamNetworkChange"
            :dropdown-class-name="themeSwitcher.currentTheme">
            <a-select-option value="tcp">TCP</a-select-option>
            <a-select-option value="kcp">mKCP</a-select-option>
            <a-select-option value="ws">WebSocket</a-select-option>
            <a-select-option v-if="inbound.stream.network === 'http'" value="http" disabled>H2 (removed)</a-select-option>
            <a-select-option v-if="inbound.stream.network === 'quic'" value="quic" disabled>QUIC (removed)</a-select-option>
            <a-select-option value="grpc">gRPC</a-select-option>
            <a-select-option value="httpupgrade">HTTPUpgrade</a-select-option>
            <a-select-option value="xhttp">XHTTP</a-select-option>
            <a-select-option value="xdrive">XDRIVE</a-select-option>
        </a-select>
    </a-form-item>
</a-form>
<a-alert v-if="['http', 'quic'].includes(inbound.stream.network)" type="error" show-icon
    message="当前 Xray 已移除旧 H2 / QUIC 传输。原配置已保留；请手动迁移为 XHTTP stream-one，并根据需求设置 TLS ALPN h2 / h3，之后重新生成或刷新订阅。" style="margin-bottom: 12px;"></a-alert>

<!-- tcp -->
<template v-if="inbound.stream.network === 'tcp'">
    {{template "form/streamTCP"}}
</template>

<!-- kcp -->
<template v-if="inbound.stream.network === 'kcp'">
    {{template "form/streamKCP"}}
</template>

<!-- ws -->
<template v-if="inbound.stream.network === 'ws'">
    {{template "form/streamWS"}}
</template>

<!-- http -->
<template v-if="inbound.stream.network === 'http'">
    {{template "form/streamHTTP"}}
</template>

<!-- grpc -->
<template v-if="inbound.stream.network === 'grpc'">
    {{template "form/streamGRPC"}}
</template>

<!-- httpupgrade -->
<template v-if="inbound.stream.network === 'httpupgrade'">
    {{template "form/streamHTTPUpgrade"}}
</template>

<!-- xhttp -->
<template v-if="inbound.stream.network === 'xhttp'">
    <a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
        <a-form-item label="Host"><a-input v-model.trim="inbound.stream.xhttp.host"></a-input></a-form-item>
        <a-form-item label="Path"><a-input v-model.trim="inbound.stream.xhttp.path"></a-input></a-form-item>
        <a-form-item label="Mode">
            <a-select v-model="inbound.stream.xhttp.mode" :dropdown-class-name="themeSwitcher.currentTheme">
                <a-select-option v-for="mode in ['auto','packet-up','stream-up','stream-one']" :key="mode" :value="mode">[[ mode ]]</a-select-option>
            </a-select>
        </a-form-item>
        <a-form-item label="Advanced XHTTP JSON">
            <a-textarea v-model="inbound.stream.xhttp.extraText" :rows="8" spellcheck="false"></a-textarea>
        </a-form-item>
    </a-form>
</template>
<template v-if="inbound.stream.network === 'xdrive'">
    <a-alert type="info" show-icon message="XDRIVE 使用 JSON 订阅；没有通用的分享链接格式。" style="margin-bottom: 12px;"></a-alert>
    <a-form-item label="XDRIVE JSON"><a-textarea v-model="inbound.stream.xdriveText" :rows="8" spellcheck="false"></a-textarea></a-form-item>
</template>
<a-form-item label="FinalMask JSON" v-if="!inbound.stream.isReality">
    <a-textarea v-model="inbound.stream.finalMaskText" :rows="5" spellcheck="false"></a-textarea>
</a-form-item>

<!-- sockopt -->
<template>
    {{template "form/streamSockopt"}}
</template>
{{end}}
