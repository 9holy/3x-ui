<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<body>
<a-layout id="app" v-cloak :class="themeSwitcher.currentTheme">
  {{template "commonSider" .}}
  <a-layout id="content-layout">
    <a-layout-content style="margin: 24px 16px;">
      <a-card title="Nodes" hoverable>
        <a-form layout="inline" style="margin-bottom: 16px;">
          <a-form-item label="Name"><a-input v-model="form.name"></a-input></a-form-item>
          <a-form-item label="Base URL"><a-input v-model="form.baseUrl" placeholder="https://node.example"></a-input></a-form-item>
          <a-form-item label="Token"><a-input-password v-model="form.token"></a-input-password></a-form-item>
          <a-form-item><a-switch v-model="form.enable"></a-switch></a-form-item>
          <a-form-item><a-button type="primary" @click="save">Save</a-button></a-form-item>
        </a-form>
        <a-table :data-source="nodes" :row-key="node => node.id" :pagination="false">
          <a-table-column title="Name" data-index="name"></a-table-column>
          <a-table-column title="Base URL" data-index="baseUrl"></a-table-column>
          <a-table-column title="Enabled" data-index="enable">
            <template slot-scope="enabled"><a-tag :color="enabled ? 'green' : 'default'">[[ enabled ? 'Yes' : 'No' ]]</a-tag></template>
          </a-table-column>
          <a-table-column title="Last Sync" data-index="lastSyncAt"></a-table-column>
          <a-table-column title="Actions">
            <template slot-scope="_, node">
              <a-space>
                <a-button size="small" @click="sync(node)">Sync</a-button>
                <a-button size="small" type="danger" @click="remove(node)">Delete</a-button>
              </a-space>
            </template>
          </a-table-column>
        </a-table>
      </a-card>
    </a-layout-content>
  </a-layout>
</a-layout>
<script>
new Vue({
  delimiters: ['[[', ']]'],
  el: '#app',
  data: {
    nodes: [],
    form: { id: 0, name: '', baseUrl: '', token: '', enable: true },
  },
  mounted() { this.load(); },
  methods: {
    async load() {
      const msg = await HttpUtil.get('/panel/api/nodes/list');
      if (msg.success) this.nodes = msg.obj || [];
    },
    async save() {
      const msg = await HttpUtil.post('/panel/api/nodes/save', this.form);
      if (msg.success) { this.form = { id: 0, name: '', baseUrl: '', token: '', enable: true }; await this.load(); }
    },
    async sync(node) {
      const msg = await HttpUtil.post('/panel/api/nodes/sync/' + node.id);
      if (msg.success) await this.load();
    },
    async remove(node) {
      const msg = await HttpUtil.post('/panel/api/nodes/delete/' + node.id);
      if (msg.success) await this.load();
    },
  },
});
</script>
</body>
</html>
