{{define "inboundModal"}}
<a-modal id="inbound-modal" v-model="inModal.visible" :title="inModal.title"
        :dialog-style="{ top: '20px' }" @ok="inModal.ok"
        :confirm-loading="inModal.confirmLoading" :closable="true" :mask-closable="false"
        :class="themeSwitcher.currentTheme"
        :ok-text="inModal.okText" cancel-text='{{ i18n "close" }}'>
    <a-tabs :active-key="inModal.activeKey" @change="inModal.changeTab">
        <a-tab-pane key="form" tab="Form">{{template "form/inbound"}}</a-tab-pane>
        <a-tab-pane key="json" tab="Protocol JSON">
            <a-textarea v-model="inModal.jsonText" :rows="24" spellcheck="false"></a-textarea>
        </a-tab-pane>
    </a-tabs>
</a-modal>
<script>

    const inModal = {
        title: '',
        visible: false,
        confirmLoading: false,
        okText: '{{ i18n "sure" }}',
        isEdit: false,
        activeKey: 'form',
        jsonText: '{}',
        confirm: null,
        inbound: new Inbound(),
        dbInbound: new DBInbound(),
        ok() {
            try {
                if (this.activeKey === 'json') this.inbound = Inbound.fromJson(ProtocolUtil.parse(this.jsonText, 'Inbound JSON'));
                const stream = this.inbound.toJson().streamSettings;
                if (['http', 'h2', 'quic'].includes(stream?.network)) throw new Error('旧 H2 / QUIC 传输已移除，请先手动迁移到 XHTTP stream-one (TLS ALPN h2 / h3)。');
                if (stream?.network === 'kcp' && stream.kcpSettings?.seed === '') throw new Error('旧 mKCP 显式空 seed 不兼容，请设置非空 seed 并刷新客户端订阅。');
                ObjectUtil.execute(this.confirm, this.inbound, this.dbInbound);
            } catch (error) {
                Vue.prototype.$message.error(error.message);
            }
        },
        changeTab(key) {
            try {
                if (key === 'json') this.jsonText = JSON.stringify(this.inbound.toJson(), null, 2);
                else this.inbound = Inbound.fromJson(ProtocolUtil.parse(this.jsonText, 'Inbound JSON'));
                this.activeKey = key;
            } catch (error) { Vue.prototype.$message.error(error.message); }
        },
        show({ title = '', okText = '{{ i18n "sure" }}', inbound = null, dbInbound = null, confirm = (inbound, dbInbound) => {}, isEdit = false }) {
            this.activeKey = 'form';
            this.title = title;
            this.okText = okText;
            if (inbound) {
                this.inbound = Inbound.fromJson(inbound.toJson());
            } else {
                this.inbound = new Inbound();
            }
            if (dbInbound) {
                this.dbInbound = new DBInbound(dbInbound);
            } else {
                this.dbInbound = new DBInbound();
            }
            this.confirm = confirm;
            this.visible = true;
            this.isEdit = isEdit;
        },
        close() {
            inModal.visible = false;
            inModal.loading(false);
        },
        loading(loading=true) {
            inModal.confirmLoading = loading;
        },
    };

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#inbound-modal',
        data: {
            inModal: inModal,
            delayedStart: false,
            get inbound() {
                return inModal.inbound;
            },
            get dbInbound() {
                return inModal.dbInbound;
            },
            get isEdit() {
                return inModal.isEdit;
            },
            get client() {
                return inModal.inbound.clients[0];
            },
            get datepicker() {
                return app.datepicker;
            },
            get delayedExpireDays() {
                return this.client && this.client.expiryTime < 0 ? this.client.expiryTime / -86400000 : 0;
            },
            set delayedExpireDays(days) {
                this.client.expiryTime = -86400000 * days;
            },
            get externalProxy() {
                return this.inbound.stream.externalProxy.length > 0;
            },
            set externalProxy(value) {
                if (value) {
                    inModal.inbound.stream.externalProxy = [{
                        forceTls: "same",
                        dest: window.location.hostname,
                        port: inModal.inbound.port,
                        remark: ""
                    }];
                } else {
                    inModal.inbound.stream.externalProxy = [];
                }
            }
        },
        methods: {
            updateWireguardPeerKey(peer) {
                try { peer.publicKey = ProtocolUtil.wireguardPublicKey(peer.privateKey); }
                catch (_) { /* A partially typed key remains editable; saving validates it. */ }
            },
            streamNetworkChange() {
                const inbound = inModal.inbound;
                if (!inbound.canEnableTls()) inbound.stream.security = 'none';
                if (inbound.stream.isReality && !inbound.canEnableReality()) inbound.stream.security = 'none';
                if (inbound.protocol === Protocols.VLESS && !inbound.canEnableTlsFlow()) {
                    inbound.settings.vlesses.forEach(client => { client.flow = ''; });
                }
            },

            SSMethodChange() {
                if (this.inModal.inbound.isSSMultiUser) {
                    if (this.inModal.inbound.settings.shadowsockses.length ==0){
                        this.inModal.inbound.settings.shadowsockses = [new Inbound.ShadowsocksSettings.Shadowsocks()];
                    }
                    if (!this.inModal.inbound.isSS2022) {
                        this.inModal.inbound.settings.shadowsockses.forEach(client => {
                            client.method = this.inModal.inbound.settings.method;
                        })
                    } else {
                        this.inModal.inbound.settings.shadowsockses.forEach(client => {
                            client.method = "";
                        })
                    }
                } else {
                    if (this.inModal.inbound.settings.shadowsockses.length > 0){
                        this.inModal.inbound.settings.shadowsockses = [];
                    }
                }
            },
            setDefaultCertData(index) {
                inModal.inbound.stream.tls.certs[index].certFile = app.defaultCert;
                inModal.inbound.stream.tls.certs[index].keyFile = app.defaultKey;
            },
            setDefaultCertXtls(index) {
                inModal.inbound.stream.xtls.certs[index].certFile = app.defaultCert;
                inModal.inbound.stream.xtls.certs[index].keyFile = app.defaultKey;
            },
            async getNewX25519Cert() {
                inModal.loading(true);
                const msg = await HttpUtil.post('/server/getNewX25519Cert');
                inModal.loading(false);
                if (!msg.success) {
                    return;
                }
                inModal.inbound.stream.reality.privateKey = msg.obj.privateKey;
                inModal.inbound.stream.reality.settings.publicKey = msg.obj.publicKey;
            }
        },
    });

</script>
{{end}}
